name: FreeBSD CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: freebsd-${{ matrix.version}}-${{ matrix.arch}}
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.arch }}-${{ matrix.version }}
      cancel-in-progress: true
    strategy:
      matrix:
        arch: ['aarch64', 'x86_64']
        version: ['14.2', '15.0']
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        uses: vmactions/freebsd-vm@v1.2.0
        with:
          arch: ${{ matrix.arch }}
          release: ${{ matrix.version }}
          usesh: true
          # Fix for FreeBSD 15.0: disable repo update during pkg install
          prepare: |
            export PKG_DISABLE_AUTOUPDATE=1
            export ASSUME_ALWAYS_YES=1
            pkg install -y xmlrpc-c 2>/dev/null || true
          run: |
            make
